<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06182C" />
      <stop offset="50%" stop-color="#002A54" />
      <stop offset="100%" stop-color="#021424" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Saffron/Cyan Border -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="3.5" stroke-opacity="0.85" />
  
  <!-- Subtle Outer Radar Scanning Ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.45" />
  <circle cx="64" cy="64" r="30" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- 6-Point Polar Crystal / Snowflake Geometry -->
  <g stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Vertical Spine -->
    <line x1="64" y1="20" x2="64" y2="108" />
    <!-- Diagonal Spines -->
    <line x1="26" y1="42" x2="102" y2="86" />
    <line x1="26" y1="86" x2="102" y2="42" />

    <!-- Branchlets -->
    <!-- Top -->
    <line x1="64" y1="36" x2="52" y2="28" stroke-width="3.5" />
    <line x1="64" y1="36" x2="76" y2="28" stroke-width="3.5" />
    <!-- Bottom -->
    <line x1="64" y1="92" x2="52" y2="100" stroke-width="3.5" />
    <line x1="64" y1="92" x2="76" y2="100" stroke-width="3.5" />
    <!-- Top-Right -->
    <line x1="88" y1="50" x2="94" y2="38" stroke-width="3.5" />
    <line x1="88" y1="50" x2="98" y2="56" stroke-width="3.5" />
    <!-- Bottom-Left -->
    <line x1="40" y1="78" x2="30" y2="72" stroke-width="3.5" />
    <line x1="40" y1="78" x2="34" y2="90" stroke-width="3.5" />
    <!-- Bottom-Right -->
    <line x1="88" y1="78" x2="98" y2="72" stroke-width="3.5" />
    <line x1="88" y1="78" x2="94" y2="90" stroke-width="3.5" />
    <!-- Top-Left -->
    <line x1="40" y1="50" x2="34" y2="38" stroke-width="3.5" />
    <line x1="40" y1="50" x2="30" y2="56" stroke-width="3.5" />
  </g>

  <!-- Diamond Tips on 6 Axes -->
  <g fill="#FFFFFF">
    <circle cx="64" cy="18" r="3" />
    <circle cx="64" cy="110" r="3" />
    <circle cx="24" cy="41" r="3" />
    <circle cx="104" cy="87" r="3" />
    <circle cx="24" cy="87" r="3" />
    <circle cx="104" cy="41" r="3" />
  </g>

  <!-- Central Digital Twin Core (Indian National Saffron Core with White Pulse) -->
  <circle cx="64" cy="64" r="14" fill="url(#saffronGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="64" cy="64" r="5" fill="#FFFFFF" />
</svg>
